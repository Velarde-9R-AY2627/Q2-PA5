<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</head>
<body>
    <div class="container">


         <form action="" method="post">


        <h2 class="text-center text-primary">Sneaker Order Form</h2>


        <label for="form-name" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="form-control">
    
        <label for="form-email" class="form-label">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="form-control">


        <label for="form-tel" class="form-label">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="form-control">


        <label for="form-story" class="form-label">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="form-control"></textarea>
        
        <label for="sizes">Size:</label>
        <select name="size" id="sizes">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">
            <legend>Color</legend>
            <label><input type="radio" name="color" value="red"> Red</label>
            <label><input type="radio" name="color" value="blue"> Blue</label> 
            <label><input type="radio" name="color" value="black"> Black</label> 
            <label><input type="radio" name="color" value="silver"> Silver</label>
        </fieldset>
            
        <label for="features">Add-on Features:</label>
        <fieldset id="features">
            <legend>Feature</legend>
            <label><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
            <label><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
            <label><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
            <label><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
        </fieldset>
            
        <input type="submit" value="ENTER">
    </form>
    </div>
    
   
</body>
</html>
